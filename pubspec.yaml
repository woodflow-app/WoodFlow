name: woodflow
description: WoodFlow — system operacyjny dla nowoczesnej stolarni
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend Foundation (ADR: get_it jako jedyny mechanizm DI)
  get_it: ^7.7.0

  # Persystencja lokalna (Warehouse → Offcut, wszystkie migracje v1-v6)
  sqflite: ^2.3.3
  path: ^1.9.0

  # Identyfikatory encji i podstawa formatu QR (qr_code_generator.dart)
  uuid: ^4.4.0

  # Krok 7.2 — skanowanie QR (ScanScreen)
  mobile_scanner: ^5.2.3

  # Krok 7.3 — etykiety PDF (PdfLabelGenerator; BarcodeWidget renders
  # the QR directly, no separate QR-rendering package needed)
  pdf: ^3.11.1
  printing: ^5.13.1 # udostępnianie/podgląd wygenerowanego PDF na urządzeniu

  # i18n — 21 języków (lib/l10n/*.arb)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 # WYMAGANE przez flutter_localizations z SDK — na tej
  # instalacji Fluttera SDK pinuje dokładnie intl 0.20.2; ^0.19.0 wysypuje
  # `flutter pub get` błędem "version solving failed" (zweryfikowane
  # bezpośrednio przez `flutter pub get`, nie z pamięci).
  shared_preferences: ^2.3.0 # trwały wybór języka (LocaleProvider)

  # Krok 10 — eksport PDF/CSV/RTF (ExportScreen). Bytes are handed to
  # the share sheet via XFile.fromData — no temp-file write needed, no
  # path_provider dependency: this keeps ExportScreen working on web
  # too (dart:io/path_provider's file APIs aren't available there).
  csv: ^8.0.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Backend testowy dla sqflite poza prawdziwym urządzeniem/emulatorem
  # — używane w KAŻDYM pliku test/*_test.dart (sqfliteFfiInit +
  # databaseFactoryFfi).
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  generate: true # WYMAGANE — bez tego AppLocalizations się nie wygeneruje
  assets:
    # Krok 10 — PdfExportGenerator ładuje ten plik przez rootBundle.
    # WYMAGANE dla poprawnego PDF: `pdf` package's built-in Helvetica
    # ma tylko podstawowy zestaw znaków Base-14 (bez polskich znaków
    # diakrytycznych, bez cyrylicy) — bez tej czcionki eksport PDF w
    # większości z 21 obsługiwanych języków renderowałby puste/błędne
    # znaki. Noto Sans, licencja SIL OFL 1.1 (assets/fonts/NotoSans-OFL.txt).
    - assets/fonts/NotoSans-Variable.ttf
