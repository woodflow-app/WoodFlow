<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoodFlow</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
text-align:center;
}
header{
padding:80px 20px;
}
h1{
font-size:56px;
margin-bottom:10px;
color:#22c55e;
}
p{
font-size:22px;
max-width:700px;
margin:auto;
color:#d1d5db;
}
.button{
display:inline-block;
margin-top:40px;
padding:15px 35px;
background:#22c55e;
color:white;
text-decoration:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
}
section{
padding:80px 20px;
background:#111827;
}
.card{
max-width:900px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}
.box{
background:#1f2937;
padding:30px;
border-radius:15px;
}
footer{
padding:30px;
font-size:14px;
color:#9ca3af;
}
</style>
</head>
<body>

<header>
<h1>WoodFlow</h1>
<p>Smart Inventory Management for Woodworking Companies.</p>
<a class="button" href="#">Coming Soon</a>
</header>

<section>
<h2>Why WoodFlow?</h2>
<div class="card">
<div class="box">
<h3>Inventory</h3>
<p>Track boards, sheets and offcuts.</p>
</div>

<div class="box">
<h3>Optimization</h3>
<p>Reduce waste and save material.</p>
</div>

<div class="box">
<h3>Productivity</h3>
<p>Designed for CNC workshops and furniture manufacturers.</p>
</div>
</div>
</section>

<footer>
© 2026 WoodFlow. All rights reserved.
</footer>

</body>
</html>
